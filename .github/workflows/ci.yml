name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: "pyproject.toml"
      - name: Lint the checkout with its own configuration
        run: uvx ruff check --no-cache .

  test:
    name: pytest (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # The front end tests execute real JavaScript; a checkout without Node must
      # report that as a failure rather than pass with them skipped.
      ENGAGEMENTS_REQUIRE_NODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Node version
        run: node --version
      - name: Run the test suite
        run: uv run --no-project --python ${{ matrix.python }} --with pytest --with 'pyyaml>=6,<7' python -m pytest -q -p no:cacheprovider

  host:
    name: real host (ubuntu, python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # With a host installed below these tests must run; if the host stops
      # importing they fail instead of skipping.
      ENGAGEMENTS_REQUIRE_HERMES_HOST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: "pyproject.toml"
      - name: Install a Hermes host
        # The published wheel does not carry the plugin state module these tests
        # use, and the project refuses to build wheels. A shallow, pinned checkout
        # installed editable is the supported development install.
        run: |
          git init "$RUNNER_TEMP/hermes-host"
          git -C "$RUNNER_TEMP/hermes-host" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-host" fetch --depth 1 origin 5d1435e625c034858d409a496469c271ae2e6b10
          git -C "$RUNNER_TEMP/hermes-host" checkout --detach FETCH_HEAD
          uv sync --frozen --project "$RUNNER_TEMP/hermes-host"
          uv pip install --python "$RUNNER_TEMP/hermes-host/.venv/bin/python" pytest 'pyyaml>=6,<7'
      - name: Run the tests that need an importable host
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          "$RUNNER_TEMP/hermes-host/.venv/bin/python" -m pytest -q -p no:cacheprovider tests/test_dashboard_readonly.py
