[project]
name = "hermes-engagements"
version = "1.0.0-rc1"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# A clone must lint clean on its own: no configuration outside this repository.
line-length = 88
target-version = "py311"
# One import block. This project sorts its own packages alongside third-party
# ones, so first-party detection would only ask for blank lines everywhere.
# ``src`` is the setting that decides it, and it only applies from this file: a
# configuration supplied with ``--config <file>`` replaces this one, and Ruff
# then takes the working directory as the project root, reads ``engagements`` as
# a first-party package and reports the block ordering in most files. Lint with
# the command in the README's Development section, or pass ``--config 'src = []'``
# alongside any other configuration file.
src = []

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line length is the formatter's concern
    "B008",   # calls in default arguments are deliberate
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
